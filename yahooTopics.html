<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yahoo!ニュース トップ一覧</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 40px 20px;
        color: #1f2937;
      }

      .container {
        max-width: 960px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 24px 45px rgba(15, 23, 42, 0.08);
        padding: 32px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.9rem;
      }

      p {
        margin: 0 0 24px;
        color: #475569;
      }

      button {
        font-size: 1rem;
        padding: 12px 22px;
        border-radius: 999px;
        border: none;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
        transition: background 0.2s ease;
      }

      button:disabled {
        background: #94a3b8;
        cursor: wait;
        box-shadow: none;
      }

      button:hover:not(:disabled) {
        background: #1d4ed8;
      }

      .status {
        margin: 18px 0 0;
        font-size: 0.95rem;
        color: #0f172a;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 24px;
        font-size: 0.95rem;
      }

      thead {
        background: #e2e8f0;
      }

      th,
      td {
        text-align: left;
        padding: 12px 10px;
        border-bottom: 1px solid #e2e8f0;
        vertical-align: top;
      }

      tbody tr:hover {
        background: #f8fafc;
      }

      a {
        color: #1d4ed8;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .meta {
        color: #64748b;
        font-size: 0.85rem;
      }

      .error {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Yahoo!ニュース トップページの最新トピック</h1>
      <p>Yahoo!ニュースのトップトピックを取得して表で表示します。</p>
      <button id="fetch-button" type="button">ニュースを取得</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <table aria-live="polite">
        <thead>
          <tr>
            <th scope="col">タイトル</th>
            <th scope="col">公開日時</th>
            <th scope="col">リンク</th>
          </tr>
        </thead>
        <tbody id="news-body">
          <tr>
            <td colspan="3" class="meta">まだニュースを取得していません。</td>
          </tr>
        </tbody>
      </table>
    </div>

    <script>
      const button = document.getElementById("fetch-button");
      const status = document.getElementById("status");
      const newsBody = document.getElementById("news-body");

      const rssUrl = "https://news.yahoo.co.jp/rss/topics/top-picks.xml";
      const proxyUrl = "https://api.allorigins.win/raw?url=";

      const updateStatus = (message, isError = false) => {
        status.textContent = message;
        status.classList.toggle("error", isError);
      };

      const formatDate = (value) => {
        if (!value) return "-";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return new Intl.DateTimeFormat("ja-JP", {
          dateStyle: "medium",
          timeStyle: "short",
        }).format(date);
      };

      const renderRows = (items) => {
        newsBody.innerHTML = "";
        if (!items.length) {
          newsBody.innerHTML =
            '<tr><td colspan="3" class="meta">取得できるニュースがありません。</td></tr>';
          return;
        }

        const rows = items
          .map((item) => {
            const title = item.querySelector("title")?.textContent ?? "";
            const link = item.querySelector("link")?.textContent ?? "";
            const pubDate = item.querySelector("pubDate")?.textContent ?? "";
            return `
              <tr>
                <td>${title}</td>
                <td>${formatDate(pubDate)}</td>
                <td><a href="${link}" target="_blank" rel="noopener">記事を開く</a></td>
              </tr>
            `;
          })
          .join("");

        newsBody.innerHTML = rows;
      };

      const fetchNews = async () => {
        button.disabled = true;
        updateStatus("ニュースを取得中...");

        try {
          const response = await fetch(`${proxyUrl}${encodeURIComponent(rssUrl)}`);
          if (!response.ok) {
            throw new Error(`取得に失敗しました (status: ${response.status})`);
          }
          const text = await response.text();
          const parser = new DOMParser();
          const xml = parser.parseFromString(text, "text/xml");
          const items = Array.from(xml.querySelectorAll("item"));
          renderRows(items);
          updateStatus(`取得完了: ${items.length} 件`);
        } catch (error) {
          updateStatus(
            "取得に失敗しました。時間をおいて再度お試しください。",
            true,
          );
          newsBody.innerHTML =
            '<tr><td colspan="3" class="meta">ニュースを取得できませんでした。</td></tr>';
          console.error(error);
        } finally {
          button.disabled = false;
        }
      };

      button.addEventListener("click", fetchNews);
    </script>
  </body>
</html>
