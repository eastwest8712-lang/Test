<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello World Button</title>
    <style>
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f4f6f8;
        margin: 0;
      }

      button {
        font-size: 1.1rem;
        padding: 12px 24px;
        border-radius: 999px;
        border: none;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.2);
      }

      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <button id="hello-button" type="button">クリックして表示</button>

    <script>
      const button = document.getElementById("hello-button");
      button.addEventListener("click", () => {
        window.alert("Hello World");
      });
    </script>
  </body>
</html>
